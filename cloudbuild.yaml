steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - diwali-charades
      - --source=.
      - --region=us-central1
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=3
      - --memory=256Mi
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY
